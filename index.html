<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will you be my Valentine?</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root{
  --bg1:#ffd6e7;
  --bg2:#ffeef6;
  --yes:#ff3b7a;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at top,var(--bg2),var(--bg1));
  font-family:system-ui,sans-serif;
  overflow:hidden;
}
.card{
  background:#ffffffee;
  padding:24px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
  max-width:420px;
  position:relative;
  z-index:2;
}
.photo{
  width:100%;
  border-radius:18px;
  margin-bottom:12px;
}
h1{
  font-size:28px;
  margin:10px 0;
}
button{
  padding:14px 22px;
  font-size:18px;
  font-weight:800;
  border-radius:999px;
  border:none;
  cursor:pointer;
  margin:8px;
}
#yesBtn{background:var(--yes);color:#fff}
#noBtn{background:#e5e7eb}
#result{display:none;margin-top:12px}
.music-btn{
  font-size:14px;
  background:#111827;
  color:#fff;
}

/* FLOATING EMOJIS */
.emoji{
  position:fixed;
  bottom:-50px;
  font-size:28px;
  animation:floatUp linear infinite;
  opacity:.8;
}
@keyframes floatUp{
  from{transform:translateY(0);}
  to{transform:translateY(-110vh);}
}
/* ✨ Sparkles */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: radial-gradient(circle, #fff, rgba(255,255,255,0));
  border-radius: 50%;
  opacity: 0.8;
  animation: sparkleFloat linear infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes sparkleFloat {
  from {
    transform: translateY(100vh) scale(0.5);
    opacity: 0;
  }
  to {
    transform: translateY(-10vh) scale(1.2);
    opacity: 1;
  }
}

/* 🌸 Flowers */
.flower {
  position: fixed;
  top: -40px;
  font-size: 26px;
  animation: flowerFall linear infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes flowerFall {
  from {
    transform: translateY(0) rotate(0deg);
  }
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="card">
  <!-- Put photo.jpg in same folder -->
  <img src="photo.jpg" alt="Us 💕" class="photo">

  <h1>Sheeba, will you be my Valentine? 💖🐱💞</h1>

  <button id="yesBtn">Yes 💘</button>
  <button id="noBtn">No 🙈</button>
  <br>
  <button class="music-btn" id="musicBtn">▶ Play Cute BGM 🎵</button>

  <div id="result">
    <h2>YAYYYY 🐱💖🎉</h2>
    <p>My pookie forever 😽💞💞</p>
  </div>
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <!-- Rename your cute song to bgm.mp3 -->
  <source src="bgm.mp4" type="audio/mpeg">
</audio>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const result=document.getElementById("result");
const music=document.getElementById("bgMusic");
const musicBtn=document.getElementById("musicBtn");

const confettiInstance=confetti.create(document.body,{resize:true});

musicBtn.addEventListener("click",()=>{
  if(music.paused){
    music.play();
    musicBtn.textContent="⏸ Pause BGM 🐱";
  }else{
    music.pause();
    musicBtn.textContent="▶ Play Cute BGM 🎵";
  }
});

noBtn.addEventListener("mouseenter",()=>{
  noBtn.style.position="absolute";
  noBtn.style.left=Math.random()*70+"%";
  noBtn.style.top=Math.random()*70+"%";
});

yesBtn.addEventListener("click",()=>{
  result.style.display="block";
 for(let i=0;i<15;i++){
  spawnFlower();
  spawnSparkle();
  if(music.paused) music.play();
  spawnEmojis();
  }
});

/* EMOJI RAIN */
const emojis=["🐱","😽","💖","💞","💕","💘","🐾"];
function spawnEmojis(){
  for(let i=0;i<30;i++){
    const e=document.createElement("div");
    e.className="emoji";
    e.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.animationDuration=4+Math.random()*4+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),9000);
  }
}
/* ✨ Sparkle generator */
function spawnSparkle() {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDuration = 6 + Math.random() * 6 + "s";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 12000);
}
setInterval(spawnSparkle, 600);

/* 🌸 Continuous flower rain */
const flowers = ["🌸","🌼","💐","🌺","🌷"];
function spawnFlower() {
  const f = document.createElement("div");
  f.className = "flower";
  f.textContent = flowers[Math.floor(Math.random() * flowers.length)];
  f.style.left = Math.random() * 100 + "vw";
  f.style.animationDuration = 8 + Math.random() * 6 + "s";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 15000);
}
setInterval(spawnFlower, 800);
</script>

</body>
</html>
